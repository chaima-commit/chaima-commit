<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020805"/>
      <stop offset="1" stop-color="#0a1f1a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a24"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#e8ffe9"/>
      <stop offset="1" stop-color="#9fd8c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .wave { animation: sway 5s ease-in-out infinite alternate; }
    .wave2 { animation: sway 7s ease-in-out infinite alternate-reverse; }
    @keyframes sway { from { transform: translateX(-25px); } to { transform: translateX(25px); } }
    .b { fill: none; stroke: #7fffd4; stroke-width: 1; opacity: 0; animation: rise linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .6; } 100% { transform: translateY(-170px); opacity: 0; } }
    .eye { fill: #7fff00; filter: url(#blur); animation: open 7s infinite; }
    @keyframes open { 0%,60%,100% { opacity: 0; } 70%,90% { opacity: 1; } }
    .ring { fill: none; stroke: #9fd8c0; stroke-width: 1; opacity: 0; transform-origin: 400px 250px; animation: ripple 4s infinite; }
    @keyframes ripple { 0% { transform: scale(.1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
    .title { font: bold 64px Georgia, serif; letter-spacing: 12px; text-anchor: middle; fill: #cfeee0; animation: flick 6s infinite; }
    @keyframes flick { 0%,92%,96%,100% { opacity: 1; } 94% { opacity: .2; } 98% { opacity: .5; } }
    .sub { font: italic 18px Georgia, serif; text-anchor: middle; fill: #5fa58c; }
    .moonglow { animation: pulse 6s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .7; } to { opacity: 1; } }
  </style>

  <rect width="800" height="400" fill="url(#sky)"/>

  <circle class="moonglow" cx="620" cy="80" r="70" fill="url(#moon)"/>
  <circle cx="620" cy="80" r="26" fill="#e8ffe9"/>

  <!-- arbres morts -->
  <g stroke="#000" stroke-width="5" fill="none" opacity=".9">
    <path d="M40 250 L60 120 M60 160 L25 110 M58 140 L95 100"/>
    <path d="M740 250 L720 130 M722 170 L760 120 M724 150 L690 105"/>
  </g>

  <rect y="250" width="800" height="150" fill="url(#lake)"/>
  <path d="M0 250 H800" stroke="#9fd8c0" stroke-opacity=".3"/>

  <g class="wave"  opacity=".35"><path d="M-50 262 Q0 254 50 262 T150 262 T250 262 T350 262 T450 262 T550 262 T650 262 T750 262 T850 262" stroke="#9fd8c0" fill="none"/></g>
  <g class="wave2" opacity=".25"><path d="M-50 280 Q0 272 50 280 T150 280 T250 280 T350 280 T450 280 T550 280 T650 280 T750 280 T850 280" stroke="#9fd8c0" fill="none"/></g>

  <ellipse class="ring" cx="400" cy="250" rx="60" ry="10"/>
  <ellipse class="ring" cx="400" cy="250" rx="60" ry="10" style="animation-delay:2s"/>

  <!-- yeux sous l'eau -->
  <ellipse class="eye" cx="375" cy="330" rx="9" ry="4"/>
  <ellipse class="eye" cx="425" cy="330" rx="9" ry="4"/>

  <!-- bulles -->
  <circle class="b" cx="300" cy="380" r="4" style="animation-duration:5s"/>
  <circle class="b" cx="360" cy="390" r="3" style="animation-duration:6s;animation-delay:1s"/>
  <circle class="b" cx="440" cy="385" r="5" style="animation-duration:5.5s;animation-delay:2s"/>
  <circle class="b" cx="500" cy="390" r="3" style="animation-duration:4.5s;animation-delay:.5s"/>

  <text class="title" x="400" y="170">РУСАЛКА</text>
  <text class="sub"  x="400" y="205">she sleeps beneath the black water...</text>
</svg>
