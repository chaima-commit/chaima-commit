<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    .p { fill: #fff; opacity: 0; animation: fall linear infinite; }
    @keyframes fall {
      0%   { transform: translateY(-20px); opacity: 0; }
      15%  { opacity: .9; }
      100% { transform: translateY(320px); opacity: 0; }
    }
    .t { font: bold 76px monospace; letter-spacing: 14px; text-anchor: middle; }
    .r { fill: #ff2d55; animation: gl1 2.5s infinite; }
    .c { fill: #00e5ff; animation: gl2 2.5s infinite; }
    .w { fill: #fff; }
    @keyframes gl1 { 0%,90%,100%{transform:translate(0)} 92%{transform:translate(-5px,2px)} 96%{transform:translate(4px,-2px)} }
    @keyframes gl2 { 0%,90%,100%{transform:translate(0)} 92%{transform:translate(5px,-2px)} 96%{transform:translate(-4px,2px)} }
    .s { font: 16px monospace; fill: #888; text-anchor: middle; animation: blink 2s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
  </style>

  <rect width="800" height="300" fill="#050507"/>

  <circle class="p" cx="60"  cy="0" r="2"   style="animation-duration:3s;animation-delay:0s"/>
  <circle class="p" cx="130" cy="0" r="1.5" style="animation-duration:4s;animation-delay:1s"/>
  <circle class="p" cx="210" cy="0" r="3"   style="animation-duration:5s;animation-delay:.5s"/>
  <circle class="p" cx="290" cy="0" r="1.5" style="animation-duration:3.5s;animation-delay:2s"/>
  <circle class="p" cx="370" cy="0" r="2"   style="animation-duration:4.5s;animation-delay:1.5s"/>
  <circle class="p" cx="450" cy="0" r="3"   style="animation-duration:3s;animation-delay:.8s"/>
  <circle class="p" cx="530" cy="0" r="1.5" style="animation-duration:5s;animation-delay:2.5s"/>
  <circle class="p" cx="610" cy="0" r="2"   style="animation-duration:4s;animation-delay:.2s"/>
  <circle class="p" cx="690" cy="0" r="2.5" style="animation-duration:3.8s;animation-delay:1.2s"/>
  <circle class="p" cx="750" cy="0" r="1.5" style="animation-duration:4.2s;animation-delay:2.2s"/>

  <text class="t r" x="400" y="150">CHAIMA</text>
  <text class="t c" x="400" y="150">CHAIMA</text>
  <text class="t w" x="400" y="150">CHAIMA</text>

  <text class="s" x="400" y="210">keep falling...</text>
</svg>
